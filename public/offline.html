<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RearView - Offline</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #F3F2EE;
            color: #191919;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .icon {
            font-size: 64px;
            color: #939393;
            margin-bottom: 20px;
        }
        h1 { margin-bottom: 10px; }
        p { color: #595959; margin-bottom: 30px; }
        button {
            background-color: #0A66C2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background-color: #0958a8; }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost connection. Please check your network and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
