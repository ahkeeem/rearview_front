      <stop stop-color="#0A66C2"/>
      <stop offset="1" stop-color="#004182"/>
    </linearGradient>
    <linearGradient id="mirror-grad" x1="50" y1="20" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2E8F0"/>
